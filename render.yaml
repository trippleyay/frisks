# Render Blueprint for Frisks
# FRISKS_PEER_HEALTH_URL values assume the service names below; update on rename.
# PORT is injected by Render automatically; do not declare it in envVars.

services:
  - type: web
    name: frisks-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m frisks.main
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: FRISKS_LOG_LEVEL
        value: INFO
      - key: FRISKS_B402_ENABLED
        value: "false"
      - key: FRISKS_PEER_HEALTH_URL
        value: https://frisks-mcp.onrender.com/health
      # Secrets: prompted for at Blueprint creation (sync: false), optional.
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: frisks-mcp
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt -r frisks/mcp/requirements.txt
    startCommand: python -m frisks.mcp
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: FRISKS_MCP_TRANSPORT
        value: streamable-http
      - key: FRISKS_LOG_LEVEL
        value: INFO
      - key: FRISKS_B402_ENABLED
        value: "false"
      - key: FRISKS_PEER_HEALTH_URL
        value: https://frisks-api.onrender.com/healthz
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
